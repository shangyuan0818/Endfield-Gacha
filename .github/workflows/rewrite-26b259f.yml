name: Exact rewrite of 26b259f

on:
  push:
    branches:
      - "tmp/rewrite-26b259f-work-20260926"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source commit
        uses: actions/checkout@v4
        with:
          ref: tmp/rewrite-26b259f-work-20260926
          fetch-depth: 0

      - name: Apply only the requested byte replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("main.cpp")
          before = path.read_bytes()

          old_export = b'\\"export_app_version\\": \\"2.7.0\\"'
          new_export = b'\\"export_app_version\\": \\"v2.7.0\\"'
          old_version = b"0.1.4.0"
          new_version = b"0.1.4.1"

          export_count = before.count(old_export)
          version_count = before.count(old_version)
          if export_count != 1:
              raise SystemExit(f"expected exactly one export_app_version target, found {export_count}")
          if version_count < 1:
              raise SystemExit("expected at least one 0.1.4.0 occurrence")
          if before.count(new_export) != 0:
              raise SystemExit("v2.7.0 export_app_version already existed before rewrite")
          if before.count(new_version) != 0:
              raise SystemExit("0.1.4.1 already existed before rewrite")

          after = before.replace(old_export, new_export).replace(old_version, new_version)
          if after.count(old_export) != 0 or after.count(new_export) != 1:
              raise SystemExit("export_app_version replacement verification failed")
          if after.count(old_version) != 0 or after.count(new_version) != version_count:
              raise SystemExit("version replacement verification failed")

          restored = after.replace(new_export, old_export).replace(new_version, old_version)
          if restored != before:
              raise SystemExit("rewrite changed bytes outside the requested replacements")

          path.write_bytes(after)
          if path.read_bytes() != after:
              raise SystemExit("written file did not round-trip byte-for-byte")

          print(f"export_app_version replacements: {export_count}")
          print(f"0.1.4.0 -> 0.1.4.1 replacements: {version_count}")
          PY

          rm -- .github/workflows/rewrite-26b259f.yml

      - name: Commit the exact working tree
        shell: bash
        env:
          WORK_BRANCH: tmp/rewrite-26b259f-work-20260926
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.cpp .github/workflows/rewrite-26b259f.yml
          git -c core.whitespace=cr-at-eol diff --cached --check

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s' '.github/workflows/rewrite-26b259f.yml' 'main.cpp')"
          if [ "$staged" != "$expected" ]; then
            printf 'unexpected staged paths:\n%s\n' "$staged" >&2
            exit 1
          fi

          git commit -m "chore: prepare exact verified rewrite"
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"

      - name: Remove temporary branches after the verified rewrite reaches main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_SHA: 26b259fabffdf28118d3802f7b9d2e40ad2bf87e
          PARENT_SHA: 4e7142b7af69dbb5557dd54e6182f41420ca6d2e
          BASE_BRANCH: tmp/rewrite-26b259f-base-20260926
          WORK_BRANCH: tmp/rewrite-26b259f-work-20260926
        run: |
          for _ in $(seq 1 240); do
            main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ -n "$main_sha" ] && [ "$main_sha" != "$OLD_SHA" ]; then
              metadata="$(curl -fsS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${main_sha}")"
              status="$(printf '%s' "$metadata" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["parents"][0]["sha"], str(d["commit"]["verification"]["verified"]).lower())')"
              read -r parent verified <<<"$status"
              if [ "$parent" = "$PARENT_SHA" ] && [ "$verified" = "true" ]; then
                git push origin --delete "$BASE_BRANCH"
                git push origin --delete "$WORK_BRANCH"
                exit 0
              fi
            fi
            sleep 5
          done

          echo "timed out waiting for the verified replacement commit on main" >&2
          exit 1
